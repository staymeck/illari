# Same as trend_pullback_fib.yaml, plus restricting entries to the
# London/New York/overlap sessions — testing the original "hora de entrada
# al mercado" hypothesis from the start of docs/PLAN.md as an actual filter
# instead of just a post-hoc report breakdown.
name: session_filtered_pullback

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: session_filter
    params:
      sessions: [london, new_york, overlap_london_ny]
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: fixed_pct
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
