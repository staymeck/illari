# Same as trend_pullback_fib.yaml, but the stop only confirms on a close
# beyond it instead of an intrabar wick touch — Kaufman's explicit
# recommendation (Trading Systems and Methods, ch. 23) for avoiding
# noise-driven stop-outs. See docs/PLAN.md and src/backtest/engine.py's
# module docstring for the asymmetric stop/target trigger reasoning.
name: trend_pullback_close_stop

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: fixed_pct
    trigger: close
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
