# trend_pullback_htf_minimal.yaml + the two strongest individual filters
# from the one-at-a-time comparison (volume, then candlestick) — combined,
# but deliberately NOT the full 5-filter chain. See docs/PLAN.md /
# Bitácora Illari.
name: trend_pullback_htf_plus_volume_candle

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1
  - piece: candlestick

risk:
  stop:
    piece: fixed_pct
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
