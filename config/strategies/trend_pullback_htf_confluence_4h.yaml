# Stage 1 of the experiment protocol (Bitácora Illari): identical to
# trend_pullback_htf_confluence.yaml — the frozen baseline — plus ONE
# additional confirmation, higher_tf_trend_2, requiring the 4h trend to
# also agree (uptrend). Nothing else changes: same setup, same stop/target,
# same execution timeframe (1h). Needs the caller to pass higher_tf_df_2
# (4h) in addition to higher_tf_df (1d) — this YAML alone doesn't fetch it.
#
# Now the entry requires all three: 1d (higher_tf_trend) AND 4h
# (higher_tf_trend_2) AND 1h (context.dow_trend) in agreement — exactly the
# "trend_1d == trend_4h == trend_1h" rule from the user's proposal.
name: trend_pullback_htf_confluence_4h

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: higher_tf_trend_2
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: structural_stop
    params:
      tolerance_pct: 0.5
      buffer_pct: 2.0
      max_stop_pct: 5.0
      fallback_pct: 0.5
      min_confluence: 2
  target:
    piece: structural_target
    params:
      tolerance_pct: 0.5
      buffer_pct: 0.1
      min_risk_reward: 1.0
      fallback_ratio: 2.0
      min_confluence: 2

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
