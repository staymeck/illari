# trend_pullback_htf_minimal.yaml + Fibonacci ONLY — one filter at a time,
# not chained. See docs/PLAN.md / Bitácora Illari.
name: trend_pullback_htf_plus_fib

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0

risk:
  stop:
    piece: fixed_pct
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
