# Isolated baseline: dow_trend + support_touch only, no Fibonacci/
# candlestick/volume confirmations. Exists purely to give
# probability_isolated.yaml a fair, like-for-like comparison — same
# question ("does swapping the context piece for probability_trend help?")
# without the rest of the confirmation stack burying the answer either way.
# See docs/PLAN.md.
name: trend_pullback_isolated

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations: []

risk:
  stop:
    piece: fixed_pct
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
