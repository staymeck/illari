# Same as trend_pullback_htf_structural_stop.yaml, but both the stop AND
# the target now require min_confluence=2: a candidate level only counts if
# it's confirmed by BOTH a real swing pivot AND an independent Fibonacci
# level, not just whichever is nearest. Tests the user's refinement of the
# structural stop/target idea directly — see
# src/strategies/risk/structural_stop.py / structural_target.py and
# src/analysis/structure.py's nearest_confluent_level.
name: trend_pullback_htf_confluence

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: structural_stop
    params:
      tolerance_pct: 0.5
      buffer_pct: 2.0
      max_stop_pct: 5.0
      fallback_pct: 0.5
      min_confluence: 2
  target:
    piece: structural_target
    params:
      tolerance_pct: 0.5
      buffer_pct: 0.1
      min_risk_reward: 1.0
      fallback_ratio: 2.0
      min_confluence: 2

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
