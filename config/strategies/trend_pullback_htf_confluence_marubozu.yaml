# Same as trend_pullback_htf_confluence.yaml (the current live baseline),
# plus ONE extra confirmation: the entry candle must be a bullish marubozu
# (confirmations/candle_geometry.py — body >= 90% of its own range, no
# real doubt in that candle) — rescued from a colleague's exploratory
# branch, isolated here for an ablation test against the frozen baseline.
name: trend_pullback_htf_confluence_marubozu

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1
  - piece: marubozu
    params:
      body_ratio_min: 0.9

risk:
  stop:
    piece: structural_stop
    params:
      tolerance_pct: 0.5
      buffer_pct: 2.0
      max_stop_pct: 5.0
      fallback_pct: 0.5
      min_confluence: 2
  target:
    piece: structural_target
    params:
      tolerance_pct: 0.5
      buffer_pct: 0.1
      min_risk_reward: 1.0
      fallback_ratio: 2.0
      min_confluence: 2

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
