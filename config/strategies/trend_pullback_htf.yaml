# Same as trend_pullback_fib.yaml, plus requiring the higher timeframe
# (passed by the caller as `higher_tf_df`, e.g. 1d while trading this on
# 1h) to also be in an uptrend — Kaufman, ch. 19 "Multiple Time Frames".
# See docs/PLAN.md. Needs run_backtest(df, strategy, higher_tf_df=...) —
# this YAML alone doesn't fetch the second timeframe.
name: trend_pullback_htf

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: fixed_pct
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
