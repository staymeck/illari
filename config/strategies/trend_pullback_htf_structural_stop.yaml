# Identical to trend_pullback_htf.yaml, except the stop: instead of an
# arbitrary fixed percentage below the entry reference, structural_stop
# anchors it to the nearest REAL level below entry (a clustered prior
# support, or the next Fibonacci retracement level down) — see
# src/strategies/risk/structural_stop.py. Isolates this one variable for a
# fair comparison, same principle as every other single-variable swap this
# session (ATR stop, ADX strength, etc.).
#
# buffer_pct=2.0 chosen from a sweep (0.1 to 7.0) across all 5 markets, both
# windows: the default 0.1 was too tight (support_touch already requires
# entry within 1% of this SAME level, so a 0.1% buffer barely clears price's
# own noise) and 5.0+ silently disables the structural mechanism entirely
# (once buffer_pct approaches max_stop_pct, every stop distance exceeds the
# ceiling and falls back to a fixed %, degenerating into fixed_pct_stop's
# own math). 2.0 was the best point found, though the sweep was not
# monotonic (1.0 and 3.0 were both worse) — flagged honestly as a real risk
# of overfitting to this exact dataset from trying 8 values on it, not a
# provably optimal constant. Its most interesting property isn't a higher
# blended average (still net negative) but a narrower known-vs-virgin gap
# than fixed_pct_stop (11.65 points apart -> 7.09) — more consistent across
# regimes, not necessarily more profitable.
name: trend_pullback_htf_structural_stop

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: structural_stop
    params:
      tolerance_pct: 0.5
      buffer_pct: 2.0
      max_stop_pct: 5.0
      fallback_pct: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
