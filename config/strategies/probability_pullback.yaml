# Same as trend_pullback_fib.yaml, but the trend context is decided by a
# historical frequency table (probability_trend) instead of Dow-theory
# swing analysis. NOT walk-forward validated as shipped — see
# src/analysis/probability_table.py and docs/PLAN.md. The table itself
# (params.table) is a runtime object, injected by the caller after
# load_strategy() — see scripts/run_lab_comparison.py — not stored here.
name: probability_pullback

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: probability_trend
  required: uptrend
  params:
    min_probability: 0.55
    adx_period: 14
    rsi_period: 14

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: fixed_pct
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
