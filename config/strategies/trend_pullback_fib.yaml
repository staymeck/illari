# Default catalog strategy — reproduces exactly the one hardcoded strategy
# the engine used before the catalog existed (see docs/PLAN.md,
# "Config-driven strategy catalog", regression gate). Long-only.
name: trend_pullback_fib

# How pivots are detected for every structure-based piece below (dow_trend,
# support_touch, fibonacci) and how much trailing history each bar sees.
engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: fixed_pct
    params:
      pct_below_reference: 0.5
  target:
    piece: risk_reward
    params:
      ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
