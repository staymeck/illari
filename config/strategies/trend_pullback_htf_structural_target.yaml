# Same as trend_pullback_htf_structural_stop.yaml, plus the mirror-image
# change on the other side of the trade: instead of an arbitrary 2x-risk
# take-profit, structural_target anchors it to the nearest REAL resistance
# above entry (a clustered prior swing high, the current up-leg's own high,
# or a Fibonacci retracement level inside it) — see
# src/strategies/risk/structural_target.py. Isolates this one additional
# variable against trend_pullback_htf_structural_stop.yaml for a fair
# comparison.
name: trend_pullback_htf_structural_target

engine:
  lookback_bars: 200
  swing_order: 3

context:
  piece: dow_trend
  required: uptrend
  params:
    order: 3
    lookback_swings: 2

setup:
  piece: support_touch
  params:
    order: 3
    tolerance_pct: 1.0

confirmations:
  - piece: higher_tf_trend
    params:
      required: uptrend
      order: 3
      lookback_swings: 2
  - piece: fibonacci
    params:
      order: 3
      tolerance_pct: 1.0
  - piece: candlestick
  - piece: volume
    params:
      window: 20
      spike_threshold: 1.2
      min_bias: 0.1

risk:
  stop:
    piece: structural_stop
    params:
      tolerance_pct: 0.5
      buffer_pct: 2.0
      max_stop_pct: 5.0
      fallback_pct: 0.5
  target:
    piece: structural_target
    params:
      tolerance_pct: 0.5
      buffer_pct: 0.1
      min_risk_reward: 1.0
      fallback_ratio: 2.0

style:
  max_holding_bars: 24
  fee_pct: 0.1
  initial_equity: 10000.0
